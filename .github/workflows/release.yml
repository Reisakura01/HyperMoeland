name: release

on:
  push:
    tags: [ 'v*' ]

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 发布为「自包含单文件 exe」——免装 .NET、用户可直接运行/删除
      - name: Publish (single-file, self-contained)
        run: dotnet publish Islora/Islora.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      # 只负责把「自包含单文件 exe」挂到 Release 上。
      # 注意：Release 本体（标题/说明/其余资产）由人工用 gh release create 创建，
      # 因此这里关掉 generate_release_notes —— 否则自动生成的改动日志会覆盖手写说明。
      - name: Attach to Release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/Islora.exe
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') || contains(github.ref_name, '-pre') }}
